<!DOCTYPE html>
<html lang="__HTML_LANG__">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Os textos __...__ são preenchidos por idioma no build (ver vite.config.ts → seoPages) -->
    <title>__TITLE__</title>
    <meta name="description" content="__DESC__" />
    <meta name="author" content="StockFlex" />
    <link rel="canonical" href="__CANONICAL__" />
    <link rel="alternate" hreflang="es" href="__HREF_ES__" />
    <link rel="alternate" hreflang="pt" href="__HREF_PT__" />
    <link rel="alternate" hreflang="x-default" href="https://stockflex.com.py/" />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StockFlex" />
    <meta property="og:url" content="__CANONICAL__" />
    <meta property="og:title" content="__OG_TITLE__" />
    <meta property="og:description" content="__OG_DESC__" />
    <meta property="og:image" content="__OG_IMAGE__" />
    <meta property="og:locale" content="__OG_LOCALE__" />
    <meta property="og:locale:alternate" content="__OG_LOCALE_ALT__" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__OG_TITLE__" />
    <meta name="twitter:description" content="__OG_DESC__" />
    <meta name="twitter:image" content="__OG_IMAGE__" />

    <link rel="icon" href="/favicon.ico" />
    <meta name="theme-color" content="#06408a" />
    <meta name="format-detection" content="telephone=no" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
